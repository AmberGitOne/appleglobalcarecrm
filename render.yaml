# Render blueprint.
#
# In the Render dashboard: New -> Blueprint -> point it at this repo.
# Render reads this file and provisions the service and its disk.
#
# The disk is the important part. Render's filesystem is otherwise ephemeral,
# so without it the SQLite database would reset on every deploy and restart.

services:
  - type: web
    name: apple-globalcare-crm
    runtime: node
    plan: starter          # the free plan has no persistent disk
    region: oregon
    branch: main

    buildCommand: npm ci --omit=dev --ignore-scripts

    # bootstrap.js applies the schema, and seeds ONLY when the database has
    # no users. Migrating alone would leave the first deploy with zero users,
    # which with REQUIRE_AUTH=true means nobody can sign in. It is also safe
    # on every later deploy: it leaves existing data alone.
    startCommand: node server/db/bootstrap.js && node server/index.js

    healthCheckPath: /api/health

    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/crm.db
      - key: REQUIRE_AUTH
        value: "true"      # the app is reachable from the internet here
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_TTL
        value: 12h
